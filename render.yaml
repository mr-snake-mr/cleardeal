# Render blueprint. Unverified against a live deploy: no account was available
# when this was written, and `render.yaml` is not schema-checked locally.
services:
  - type: web
    name: cleardeal
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "false"
      - key: PAYPAL_ENV
        value: sandbox
      # Generated by Render, never stored in the repository.
      - key: SESSION_SECRET
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
      # Set by hand in the dashboard: a merchant's REST credentials and the
      # webhook id PayPal issues for this app. Empty PAYPAL_WEBHOOK_ID means
      # every webhook is refused, which is the safe default.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ALLOWED_ORIGINS
        value: '["https://cleardeal.onrender.com"]'
      - key: DATABASE_URL
        value: sqlite:////data/cleardeal.db
    disk:
      name: cleardeal-data
      mountPath: /data
      sizeGB: 1
