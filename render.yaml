# Render blueprint.
#
# Free plan: no persistent disk. Render only attaches disks to paid services,
# and a free service's filesystem is wiped on every deploy *and* every idle
# spin-down. The database below is therefore disposable — projects, agreements
# and the encrypted merchant credentials all vanish when the instance sleeps.
# Upgrade to `starter` and re-add the disk block before anything that must
# survive a restart:
#
#   plan: starter
#   disk:
#     name: cleardeal-data
#     mountPath: /data
#   # and set DATABASE_URL to sqlite:////data/cleardeal.db
services:
  - type: web
    name: cleardeal
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "false"
      - key: PAYPAL_ENV
        value: sandbox
      # Generated by Render, never stored in the repository.
      - key: SESSION_SECRET
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
      # Set by hand in the dashboard. Empty PayPAL_WEBHOOK_ID means every
      # webhook is refused, which is the safe default.
      #
      # There are deliberately no PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET here:
      # merchant credentials are per-tenant, entered through the app's connect
      # screen and encrypted at rest. `Settings` has no such fields, so env vars
      # by those names would be dropped silently by `extra="ignore"`.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Absent key = every analysis call returns 503 AI_UNAVAILABLE. Analysis
      # is the product's front door, so this is required, not optional.
      - key: GEMINI_API_KEY
        sync: false
      # Not a secret, and pinning it here matters: the code default is
      # `gemini-3.8-flash`, which answered 503 on every attempt on 2026-11-10,
      # and the free tier's 20-requests-per-day cap is *per model* — so the
      # exhausted `gemini-2.5-flash` pool does not block this one.
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: ALLOWED_ORIGINS
        value: '["https://cleardeal.onrender.com"]'
      # Ephemeral on the free plan, on purpose. See the header.
      - key: DATABASE_URL
        value: sqlite:///./cleardeal.db
